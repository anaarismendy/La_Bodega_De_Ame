spring.application.name=demo
# Configuración del servidor
server.port=8082

# Configuración de base de datos Supabase - Transaction Pooler
spring.datasource.url=jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.vdjszpbnfeoydcxmbflr
spring.datasource.password=BWUqPEXy6XFIImST
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración adicional para Supabase
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Logging configurado para producción
logging.level.org.springframework.jdbc=INFO
logging.level.org.hibernate.SQL=INFO

# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
spring.jpa.defer-datasource-initialization=true

# Configuración de recursos estáticos
spring.web.resources.cache.cachecontrol.max-age=3600

# Configuración de Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false