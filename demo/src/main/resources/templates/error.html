<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Licoreria Online</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link href="/css/styles.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi-shop me-2"></i>
                Licoreria Online
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-lg">
                    <div class="card-header bg-danger text-white">
                        <h2 class="mb-0">
                            <i class="bi-exclamation-triangle me-2"></i>
                            Error
                        </h2>
                    </div>
                    <div class="card-body text-center py-5">
                        <i class="bi-exclamation-circle text-danger" style="font-size: 4rem;"></i>
                        <h3 class="mt-3 mb-3">¡Oops! Algo salió mal</h3>
                        <p class="text-muted mb-4" th:text="${error ?: 'Ha ocurrido un error inesperado.'}">
                            Ha ocurrido un error inesperado.
                        </p>
                        <div class="d-flex justify-content-center gap-3">
                            <a href="/" class="btn btn-primary">
                                <i class="bi-house me-1"></i>
                                Volver al Inicio
                            </a>
                            <button class="btn btn-outline-secondary" onclick="history.back()">
                                <i class="bi-arrow-left me-1"></i>
                                Volver Atrás
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>Licoreria Online</h5>
                    <p class="mb-0">Tu tienda de confianza para los mejores licores</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="mb-0">&copy; 2024 Licoreria Online. Todos los derechos reservados.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
